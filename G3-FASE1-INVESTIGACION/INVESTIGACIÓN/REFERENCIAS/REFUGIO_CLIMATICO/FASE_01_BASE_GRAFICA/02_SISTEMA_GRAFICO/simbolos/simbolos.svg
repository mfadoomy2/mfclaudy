    <text y="24" text-anchor="middle" class="lbl">seccion</text>
  </g>
  <g transform="translate(670,130)">
    <path d="M -10 0 H 10 M -10 0 L -7 -2 M -10 0 L -7 2 M 10 0 L 7 -2 M 10 0 L 7 2" class="g"/>
    <text y="-5" text-anchor="middle" class="lbl">12.50</text>
    <text y="24" text-anchor="middle" class="lbl">cota</text>
  </g>
  <g transform="translate(750,130)">
