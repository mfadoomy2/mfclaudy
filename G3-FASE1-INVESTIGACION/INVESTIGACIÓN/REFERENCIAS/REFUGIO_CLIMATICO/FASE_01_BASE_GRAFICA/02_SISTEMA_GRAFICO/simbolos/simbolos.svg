  </g>
  <g transform="translate(560,205)">
    <path d="M -16 4 C -8 -6 8 10 16 -2" fill="none" stroke="#2E6E6B" stroke-width="3" stroke-linecap="round"/>
    <path d="M -16 4 C -8 -6 8 10 16 -2" fill="none" stroke="#FFFFFF" stroke-width="0.8"/>
    <text y="26" text-anchor="middle" class="lbl">cinta-recorrido</text>
