  <g transform="translate(760,205)">
    <circle r="6" fill="#D6577F" fill-opacity="0.8"/><line x1="-6" x2="6" stroke="#FFFFFF" stroke-width="0.8"/>
    <text y="26" text-anchor="middle" class="lbl">deposito elevado</text>
