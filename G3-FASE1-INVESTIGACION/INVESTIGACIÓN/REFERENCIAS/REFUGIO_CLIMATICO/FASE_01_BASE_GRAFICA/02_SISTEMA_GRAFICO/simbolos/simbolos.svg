  <!-- certezas -->
  <g transform="translate(30,260)">
    <text font-size="9" letter-spacing="1">CERTEZA GEOMETRICA</text>
    <path d="M 150 -3 H 210" stroke="#33322E" stroke-width="1.4"/><text x="215" y="0">G1 confirmado</text>
    <path d="M 300 -3 H 360" stroke="#33322E" stroke-width="1.4" opacity="0.85"/><text x="365" y="0">G2 muy probable</text>
    <path d="M 460 -3 H 520" stroke="#33322E" stroke-width="1.4" stroke-dasharray="4.4 3.2"/><text x="525" y="0">G3 inferido</text>
    <path d="M 610 -3 H 670" stroke="#33322E" stroke-width="1.4" stroke-dasharray="1 2.4"/><text x="675" y="0">G4 desconocido</text>
