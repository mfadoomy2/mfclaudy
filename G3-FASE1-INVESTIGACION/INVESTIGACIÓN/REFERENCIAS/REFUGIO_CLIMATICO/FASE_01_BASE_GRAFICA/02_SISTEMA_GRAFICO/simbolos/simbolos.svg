<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="Arial" font-size="7" fill="#33322E">
  <style>
    .lbl { fill:#33322E; }
    .g   { stroke:#33322E; fill:none; stroke-width:0.8; }
