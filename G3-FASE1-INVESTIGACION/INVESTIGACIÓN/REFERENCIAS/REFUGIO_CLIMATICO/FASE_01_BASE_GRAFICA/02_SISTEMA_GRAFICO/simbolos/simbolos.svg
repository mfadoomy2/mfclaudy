  <g transform="translate(430,60)">
    <circle r="8" fill="none" stroke="#D6577F" stroke-width="1"/><line x1="-8" x2="8" stroke="#D6577F" stroke-width="0.7"/>
    <text y="24" text-anchor="middle" class="lbl">deposito</text>
  </g>
  <g transform="translate(510,60)">
    <circle r="8" class="g"/><path d="M -3 -4 L 5 0 L -3 4 Z" fill="#33322E"/>
