  <g transform="translate(590,130)">
    <path d="M -10 0 H 10" stroke="#33322E" stroke-width="1.4"/>
    <path d="M -10 0 L -10 -6 M 10 0 L 10 6" stroke="#33322E" stroke-width="1.4"/>
