    <path d="M -9 0 H 9 M 0 -9 V 9 M -6.4 -6.4 L 6.4 6.4 M -6.4 6.4 L 6.4 -6.4" stroke="#8FB35B" stroke-width="0.3"/>
    <text y="26" text-anchor="middle" class="lbl">disco-canopy</text>
