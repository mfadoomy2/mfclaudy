  <text x="16" y="20" font-size="11" letter-spacing="2">CATALOGO DE SIMBOLOS — REFUGIO CLIMATICO PUERTA DEL SOL</text>

  <!-- fila 1 -->
  <g transform="translate(30,60)">
    <circle r="9" fill="none" stroke="#6F8F53" stroke-width="0.8"/><circle r="1.2" fill="#6F8F53"/>
