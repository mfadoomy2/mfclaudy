   <g id="text_11">
    <text style="font-size: 7.5px; font-family: 'Ibarra Real Nova'" transform="translate(545.531996 850.317653) rotate(-45)">piso de mercado · 40 m² por persona</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'Ibarra Real Nova'; text-anchor: middle; fill: #555555" x="622.929529" y="672.441612" transform="rotate(-0 622.929529 672.441612)">40.1 m²</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'Ibarra Real Nova'; text-anchor: start" x="358.761644" y="417.734285" transform="rotate(-0 358.761644 417.734285)">parcela 650,9 m² · 14,98 m de frente · 49,5 m de fondo</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8px; font-family: 'Ibarra Real Nova'; text-anchor: start" x="346.632724" y="137.556226" transform="rotate(-0 346.632724 137.556226)">40 × 15 m² = 600 m² de superficie privada, sin canto ni paso</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #d81b8a" x="358.761644" y="644.545095" transform="rotate(-0 358.761644 644.545095)">en una bandeja caben 14 superficies H3 con canto y paso (o 18–19 docks H5): hacen falta 3 bandejas para 40</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-size: 13px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #222222" x="35.716535" y="41.816142" transform="rotate(-0 35.716535 41.816142)">D04 · Tamaños, a la misma escala</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #555555" x="35.716535" y="62.322835" transform="rotate(-0 35.716535 62.322835)">lo que ocupa hoy una persona joven, lo que le damos y lo que mide la parcela. 40 superficies de 15 m² son 600 m²; la parcela tiene 650,9, pero en una bandeja solo caben 14–18 porque tiene 15 m de ancho</text>
  </g>
