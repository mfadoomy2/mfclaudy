   <g id="text_18">
    <text style="font-size: 9px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #222222" x="785.76378" y="420.944882" transform="rotate(-0 785.76378 420.944882)">Lo común no está en el salón: está en el chat,</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #222222" x="785.76378" y="450.411024" transform="rotate(-0 785.76378 450.411024)">en la plaza, en el bar y en Sol. La casa de cuatro</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #222222" x="785.76378" y="479.877165" transform="rotate(-0 785.76378 479.877165)">con cocina-comedor común (V01–V03) resuelve un</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #222222" x="785.76378" y="509.343307" transform="rotate(-0 785.76378 509.343307)">programa que las escenas no contienen.</text>
   </g>
   <g id="text_22">
    <text style="font-size: 9px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #222222" x="785.76378" y="568.275591" transform="rotate(-0 785.76378 568.275591)">Para el edificio: las comisiones de Sol como</text>
   </g>
   <g id="text_23">
    <text style="font-size: 9px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #222222" x="785.76378" y="597.741732" transform="rotate(-0 785.76378 597.741732)">común (cocina, lavandería, baños, taller, asamblea,</text>
   </g>
   <g id="text_24">
    <text style="font-size: 9px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #222222" x="785.76378" y="627.207874" transform="rotate(-0 785.76378 627.207874)">cuidados), y arriba, superficies.</text>
   </g>
  </g>
  <g id="text_25">
   <text style="font-size: 13px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #222222" x="35.716535" y="41.816142" transform="rotate(-0 35.716535 41.816142)">D07 · Dónde está lo común de la juventud</text>
  </g>
  <g id="text_26">
   <text style="font-size: 8px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #555555" x="35.716535" y="62.322835" transform="rotate(-0 35.716535 62.322835)">de las 150 escenas: dónde pasa y con quién; el salón compartido de la casa es el sitio que menos aparece, y cuando aparece se evita</text>
  </g>
