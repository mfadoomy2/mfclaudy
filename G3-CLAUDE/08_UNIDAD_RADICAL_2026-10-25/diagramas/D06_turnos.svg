    <text style="font-size: 9px; font-family: 'Ibarra Real Nova'; text-anchor: start; fill: #222222" x="857.19685" y="450.411024" transform="rotate(-0 857.19685 450.411024)">Por tanto: el turno no reduce camas a</text>
